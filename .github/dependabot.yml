version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /ui-react
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: terraform
    directories:
      - "/infra/terraform"
      - "/infra/terraform/modules/*"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      terraform:
        patterns:
          - "*"
