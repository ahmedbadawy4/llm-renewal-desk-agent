# Local stack: app, PostgreSQL with pgvector, MinIO, Prometheus, Grafana and the
# OpenTelemetry collector. The credentials below are demo values for a laptop.
# Start it from the repository root with `make docker-up`.

x-app-build: &app-build
  build: ..
  image: renewal-desk:compose
  working_dir: /app

services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: renewaldesk
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d renewaldesk"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Runs the Alembic migrations once and exits. The app starts after it succeeded.
  migrate:
    <<: *app-build
    command: ["python", "scripts/migrate.py"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/renewaldesk
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    <<: *app-build
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/renewaldesk
      OBJECT_STORE_BUCKET: renewal-desk
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      LLM_PROVIDER: ollama
      LLM_BASE_URL: http://host.docker.internal:11434
      LLM_MODEL: llama3.1:8b
      MAX_OUTPUT_TOKENS: 800
      REQUEST_TIMEOUT_S: 30
      DAILY_BUDGET_USD: 1.0
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
      otel-collector:
        condition: service_started

  minio:
    image: quay.io/minio/minio:RELEASE.2024-05-10T01-41-38Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: renewaldesk
      MINIO_ROOT_PASSWORD: renewaldesk123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  grafana:
    image: grafana/grafana:10.3.1
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

  otel-collector:
    image: otel/opentelemetry-collector:0.101.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v2.52.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml

volumes:
  postgres-data:
  minio-data:
  grafana-data:
