{{- if or .Values.app.openaiApiKey .Values.app.encryptionKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "renewal-desk.fullname" . }}-secrets
  labels:
    {{- include "renewal-desk.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.app.openaiApiKey }}
  openai-api-key: {{ .Values.app.openaiApiKey | b64enc }}
  {{- end }}
  {{- if .Values.app.encryptionKey }}
  encryption-key: {{ .Values.app.encryptionKey | b64enc }}
  {{- end }}
{{- end }}
