apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "renewal-desk.fullname" . }}-migrations
  labels:
    {{- include "renewal-desk.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migrations
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrations
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres@{{ include "renewal-desk.fullname" . }}-postgres:5432/renewaldesk"
          command:
            - python
            - scripts/migrate.py
