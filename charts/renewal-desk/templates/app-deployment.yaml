{{- $ollamaUrl := .Values.app.ollamaBaseUrl }}
{{- if .Values.ollama.enabled }}
{{- $ollamaUrl = printf "http://%s-ollama:%v" (include "renewal-desk.fullname" .) .Values.ollama.servicePort }}
{{- end }}
{{- $llmProvider := .Values.app.llmProvider }}
{{- if .Values.ollama.enabled }}
{{- $llmProvider = "ollama" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "renewal-desk.fullname" . }}
  labels:
    {{- include "renewal-desk.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "renewal-desk.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "renewal-desk.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/app-values: {{ toJson .Values.app | sha256sum }}
        {{- if .Values.app.deployTimestamp }}
        deploy-timestamp: {{ .Values.app.deployTimestamp | quote }}
        {{- end }}
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              value: "local"
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres@{{ include "renewal-desk.fullname" . }}-postgres:5432/renewaldesk"
            - name: OBJECT_STORE_BUCKET
              value: "renewal-desk"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://{{ include "renewal-desk.fullname" . }}-otel:4318"
            - name: DATA_DIR
              value: "{{ .Values.dataDir }}"
            - name: CORS_ORIGINS
              value: {{ .Values.app.corsOrigins | toJson | quote }}
            - name: LLM_PROVIDER
              value: {{ $llmProvider | quote }}
            - name: LLM_BASE_URL
              value: {{ $ollamaUrl | quote }}
            - name: LLM_MODEL
              value: {{ .Values.app.ollamaModel | quote }}
            - name: MAX_OUTPUT_TOKENS
              value: {{ .Values.app.maxOutputTokens | quote }}
            - name: REQUEST_TIMEOUT_S
              value: {{ .Values.app.requestTimeoutS | quote }}
            - name: DAILY_BUDGET_USD
              value: {{ .Values.app.dailyBudgetUsd | quote }}
            {{- if .Values.app.openaiApiKey }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "renewal-desk.fullname" . }}-secrets
                  key: openai-api-key
            {{- end }}
            {{- if .Values.app.openaiBaseUrl }}
            - name: OPENAI_BASE_URL
              value: {{ .Values.app.openaiBaseUrl | quote }}
            {{- end }}
            {{- if .Values.app.openaiModel }}
            - name: OPENAI_MODEL
              value: {{ .Values.app.openaiModel | quote }}
            {{- end }}
            {{- if .Values.app.encryptionKey }}
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "renewal-desk.fullname" . }}-secrets
                  key: encryption-key
            {{- end }}
            - name: RATE_LIMIT_MAX_REQUESTS
              value: {{ .Values.app.rateLimitMaxRequests | default 100 | quote }}
            - name: RATE_LIMIT_WINDOW_SECONDS
              value: {{ .Values.app.rateLimitWindowSeconds | default 60 | quote }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.dataDir }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}
